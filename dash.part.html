<style>
/* Member dashboard (dashboard.html): real accounts only. Everything here comes from the platform API (data/mig-api.js):
   GET /api/me, /api/me/inquiries, /api/me/follows, /api/me/notifications, /api/me/incoming, /api/me/stats; PATCH /api/me; POST /api/me/prefs.
   No sample numbers, POs, invoices or badges: an empty account shows honest empty states, an unreachable API says so. */
.dash { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 22px; padding-block: 20px 48px; align-items: start; }
.dnav { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 80px); }

.who small { color: var(--green); font-size: .76rem; font-weight: 700; display: block; }
.who small.apl { color: var(--muted); font-weight: 600; }
.who small.ast-wait, .who small.ast-exp, .ast-wait, .ast-exp { color: #9A6700; }
.ph .ast { display: inline-block; border-radius: 99px; padding: 1px 10px; font-size: .78rem; font-weight: 800; background: var(--green-soft); color: var(--green); }
.ph .ast.ast-wait, .ph .ast.ast-exp { background: #FFF4D6; color: #7A5A00; }
.dnav button, .dnav a.nv { display: flex; align-items: center; gap: 10px; border: 0; background: transparent; text-align: start; padding: 9px 10px; border-radius: 10px; cursor: pointer; color: var(--muted); font: inherit; font-weight: 600; font-size: .9rem; text-decoration: none; }
.dnav button:hover, .dnav a.nv:hover { background: var(--sunken); color: var(--fg); }
.dnav button.on { background: var(--green-soft); color: var(--green); }
.dnav .badge { margin-inline-start: auto; background: #C8102E; color: #fff; font-size: .7rem; border-radius: 99px; padding: 0 8px; font-weight: 800; }
.dnav .lk { margin-inline-start: auto; font-size: .7rem; }
.dnav .sep { font-size: .72rem; color: var(--muted); padding: 10px 10px 2px; font-weight: 700; }
.dnav .dadv { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; font-weight: 800; font-size: .9rem; color: var(--gold-deep); background: var(--gold-soft); text-decoration: none; white-space: nowrap; }
.dnav .dadv.lk2 { color: var(--muted); background: var(--sunken); border: 1px dashed var(--line); }
.dnav .logout { display: flex; align-items: center; gap: 10px; margin-top: 10px; padding: 10px; border-radius: 10px; border: 1px solid #F3C9C9; color: #B42318; font: inherit; font-weight: 800; background: #FFF5F5; cursor: pointer; }
.dnav .logout:hover { background: #B42318; color: #fff; border-color: #B42318; }
.panel { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.ph { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px; }
.ph h1 { font-size: clamp(1.3rem, 2.4vw, 1.7rem); font-weight: 800; }
.ph p { color: var(--muted); max-width: 62em; }
.dcard { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.dcard h2 { font-size: 1.08rem; font-weight: 800; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.kpis.k3 { grid-template-columns: repeat(3, 1fr); }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi span { font-size: .8rem; color: var(--muted); }
.kpi b { font-size: 1.7rem; font-weight: 800; }
.kpi small { font-size: .76rem; color: var(--muted); font-weight: 600; }
.two { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; }
.two > * { min-width: 0; }
.bar { height: 10px; border-radius: 99px; background: var(--sunken); overflow: hidden; }
.bar b { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--green)); border-radius: 99px; }
.todo { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: .9rem; }
.todo li { display: flex; align-items: center; gap: 8px; }
.todo .ck { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--line); display: grid; place-items: center; font-size: .7rem; flex: none; }
.todo li.done { color: var(--muted); }
.todo li.done .ck { background: var(--green); border-color: var(--green); color: #fff; }
.todo a { font-weight: 700; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.fg { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.f { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; font-weight: 700; min-width: 0; }
.f.full { grid-column: 1 / -1; }
.f input, .f select, .f textarea { font: inherit; font-weight: 400; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; min-width: 0; width: 100%; box-sizing: border-box; }
.f textarea { min-height: 80px; resize: vertical; }
.f small { font-weight: 400; color: var(--muted); }
.chk { display: flex; gap: 8px; align-items: flex-start; font-size: .9rem; font-weight: 600; cursor: pointer; }

.okbox { background: var(--green-soft); color: var(--green); border-radius: 12px; padding: 12px 14px; font-weight: 700; }
.erbox { background: #FDECEC; color: #B42318; border-radius: 12px; padding: 12px 14px; font-weight: 700; }
.empty { padding: 26px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 14px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.ilist { display: flex; flex-direction: column; gap: 10px; }
.inq { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 90px); }
.inq > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; padding: 12px 14px; align-items: center; }
.inq > summary::-webkit-details-marker { display: none; }
.inq > summary b { font-size: .95rem; overflow-wrap: anywhere; }
.inq > summary .sub, .sub { display: block; color: var(--muted); font-size: .78rem; font-weight: 500; }
.inq[open] > summary { border-bottom: 1px solid var(--line); background: var(--sunken); }
.inq .ib { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.inq.fx { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }
.inq .msg { white-space: pre-line; background: var(--sunken); border-radius: 10px; padding: 10px 12px; font-size: .9rem; overflow-wrap: anywhere; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; font-size: .86rem; }
.kv div { background: var(--sunken); border-radius: 10px; padding: 8px 10px; }
.kv span { display: block; color: var(--muted); font-size: .74rem; }
.frow { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--surface); }
.frow > div { flex: 1; min-width: 0; }
.frow a { font-weight: 800; overflow-wrap: anywhere; }
.nrow { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--surface); }
.nrow.un { border-color: var(--gold); background: var(--gold-soft); }
.nrow > div { flex: 1; min-width: 0; }
.mks { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.mk { border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 4px; background: var(--surface); }
.mk.on { border-color: var(--green); background: var(--green-soft); }
.mk b { font-size: .92rem; }
.mk small { color: var(--muted); font-size: .76rem; }
.mks.gcs { grid-template-columns: repeat(6, 1fr); }
.gcch3 { font-size: .95rem; font-weight: 800; margin: 14px 0 8px; }
.gccdue { border-color: var(--gold); background: var(--gold-soft); }
.gccdue h2 { font-size: 1.05rem; }
.olinks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.olinks a { display: flex; flex-direction: column; gap: 4px; border: 1px solid var(--line); border-radius: 14px; padding: 14px; background: var(--surface); text-decoration: none; color: var(--fg); }
.olinks a:hover { border-color: var(--green); background: var(--green-soft); }
.olinks b { font-size: .95rem; }
.olinks small { color: var(--muted); font-size: .8rem; line-height: 1.6; }
.note { font-size: .84rem; color: var(--muted); line-height: 1.8; }
.lgcard { max-width: 560px; margin: 10px auto; text-align: center; align-items: center; }
.lgcard img { height: 46px; }
.dk-mini { display: inline-flex; align-items: center; gap: 6px; border-radius: 99px; padding: 2px 10px; font-size: .76rem; font-weight: 800; background: var(--sunken); }
.dash.solo { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 1100px) { .kpis { grid-template-columns: repeat(2, 1fr); } .mks, .mks.gcs { grid-template-columns: repeat(3, 1fr); } .olinks { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 900px) {
  .dash { grid-template-columns: 1fr; }
  .dnav { position: static; flex-direction: row; overflow-x: auto; scrollbar-width: thin; }
  .who, .dnav .sep { display: none; }
  .dnav button, .dnav a.nv, .dnav .dadv, .dnav .logout { white-space: nowrap; flex: none; margin-top: 0; }
  .two { grid-template-columns: 1fr; }
}
@media (max-width: 560px) { .fg, .olinks { grid-template-columns: 1fr; } .mks, .mks.gcs { grid-template-columns: repeat(2, 1fr); } .kpis, .kpis.k3 { grid-template-columns: 1fr 1fr; } .kpi b { font-size: 1.35rem; } }

.bsc { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; background: radial-gradient(120% 140% at 0% 0%, #1d3c6b 0%, #0b1f3a 60%, #06142a 100%); color: #fff; border: 1px solid rgba(192,147,0,.55); border-radius: 16px; padding: 14px 16px; }
.bsc > img { width: 68px; height: 68px; border-radius: 50%; border: 3px solid #C09300; object-fit: cover; flex: none; background: #0b1f3a; }
.bsc-t { flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.bsc-t b { font-size: 1.08rem; font-weight: 900; }
.bsc-t small { color: #E2BE72; font-weight: 700; font-size: .8rem; }
.bsc-p { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 4px; font-size: .84rem; font-weight: 700; }
.bsc-p em { font-style: normal; opacity: .75; font-weight: 600; font-size: .78rem; }
.bsc-bar { flex: 1 1 120px; max-width: 220px; height: 8px; border-radius: 99px; background: rgba(255,255,255,.16); overflow: hidden; }
.bsc-bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #C09300, #F2D27A); }
.bsc-a { display: flex; gap: 8px; flex-wrap: wrap; }
.bsc .bsc-v { background: #c8102e; color: #fff; border-color: #c8102e; }
.bsc .bsc-w { background: rgba(255,255,255,.1); color: #fff; border-color: rgba(255,255,255,.35); }
@media (max-width: 560px) { .bsc-a { width: 100%; } .bsc-a > * { flex: 1 1 auto; text-align: center; } }
</style>

<script>
(function () {

  var S = { tab: "overview", me: null, unread: 0, inq: null, fol: null, notif: null, inc: null, stats: null, msg: "", focus: "" };
  var LV = A.LV;
  function pk() { return S.me ? A.planOf(S.me) : "visitor"; }
  function lv() { return LV[pk()] || 0; }
  /* deploy 2: a capability of the member's plan from the live matrix (data/plans-live.js wraps MIGPLAN.can with the Control Center caps); level rule as fallback */
  function capOn(f, minLv) { var P0 = window.MIGPLAN; return P0 && P0.can && window.MIGPLANS ? !!P0.can(f) : lv() >= minLv; }

  function planName(k) { k = k || pk(); if (k === "visitor") return T("حساب مشتري (مجاني)", "Buyer account (free)"); return P && P.name ? P.name(k) : k; }
  /* factory-only tabs: hidden for a buyer account (they register their company from «باقتي» instead) */
  var FAC = { incoming: 1, stats: 1 };
  /* the greeting: title + first name, else the company, else a neutral «أهلاً بيك» (never the e-mail's local part) */
  function hello(u) { var t = U.titleOf ? U.titleOf(u) : "", f = String(u.name || "").trim().split(/\s+/)[0] || ""; return f ? T("أهلاً يا ", "Welcome, ") + '<span dir="auto" translate="no">' + esc((t ? t + " " : "") + f) + "</span>" : u.company ? T("أهلاً بيك يا ", "Welcome, ") + '<span dir="auto" translate="no">' + esc(u.company) + "</span>" : T("أهلاً بيك", "Welcome"); }
  function scopeText() { return P && P.scopeText ? P.scopeText(pk()) : ""; }
  /* the member's GCC coverage (data/plan.js gccOf → {pick, all, chosen, pending}): Premium = Egypt + the 3 GCC states he chose;

  function loading() { return '<div class="dcard"><p class="note">⏳ ' + T("جارٍ التحميل…", "Loading…") + "</p></div>"; }

  /* ---------- tabs (level = minimum plan level; 0 = every signed-in account) ---------- */
  var TABS = [
    ["sep", "حسابي", "My account"],
    ["overview", "🏠", "نظرة عامة", "Overview", 0],
    ["inquiries", "📝", "طلباتي", "My requests", 0],
    ["follows", "★", "متابعاتي", "My follows", 0],
    ["notifications", "🔔", "الإشعارات", "Notifications", 0],
    ["sep", "الفرص", "Opportunities"],
    ["opps", "🌍", "الفرص في نطاقك", "Opportunities in your scope", 0],
    ["sep", "مصنعي", "My factory"],
    ["incoming", "📥", "طلبات واردة لي", "Requests routed to me", 2],
    ["stats", "📊", "إحصائياتي", "My statistics", 2],
    ["sep", "الإعدادات", "Settings"],
    ["profile", "👤", "بياناتي", "My details", 0],
    ["prefs", "💬", "الواتساب والإيميل", "WhatsApp & e-mail", 0],

  var LEGACY = { tenders: "opps", rfq: "opps", projects: "opps", awards: "opps", markets: "opps", directory: "opps", consult: "inquiries", myrfq: "incoming", orders: "incoming", products: "profile", seo: "profile", billing: "plan", team: "prefs" };
  function tabOK(k) { for (var i = 0; i < TABS.length; i++) if (TABS[i][0] === k) return true; return false; }
  /* deploy 2: self-service tabs plug in here (data/dash-products.js, data/dash-company.js — ACC-CONTRACT §1.7).
     h0 = the tab the address asked for at load (dashboard.html#products): those tabs are added after this script, by then boot() may

  var XT = { status: null, ext: {}, h0: (function () { var h = ""; try { h = decodeURIComponent((location.hash || "").slice(1)); } catch (x) { h = (location.hash || "").slice(1); } var m = /(?:^|&)tab=([^&]+)/.exec(h); return m ? m[1] : h.split(/[=&:/]/)[0]; })() };
  window.MIGDASH = {
    addTab: function (d) { if (!d || !d.key || tabOK(d.key)) return; var at = TABS.length;
      for (var i = 0; i < TABS.length; i++) if (TABS[i][0] === d.after) { at = i + 1; break; }
      TABS.splice(at, 0, [d.key, d.icon || "•", d.ar, d.en, d.level || 0]); V[d.key] = d.view;
      if (d.need) NEEDS[d.key] = d.need; if (d.done) XT.ext[d.key] = (XT.ext[d.key] || []).concat([d.done]);

      if (S.me) render(); },

  /* the account status line, as on the live dashboard: «✓ حساب نشط» while a plan the platform activated is running,

     honest «انتهى» once the plan's end date has passed (the server then answers plan = visitor with the old plan_expires) */
  function acctState() { var st = acctState0(); try { if (XT.status) st = XT.status(st, S.me || {}) || st; } catch (x) {} return st; }
  function acctState0() {
    var u = S.me || {}, exp = u.plan_expires && Date.parse(u.plan_expires) < Date.now();
    if (lv() >= 1) return { k: "ok", t: "✓ " + T("حساب نشط", "Active account") };
    if (exp) return { k: "exp", t: "⏳ " + T("الاشتراك انتهى — بانتظار التجديد", "Plan ended — awaiting renewal") };

    var sg = S.inq && S.inq.items && S.inq.items.some(function (x) { return x.kind === "signup"; });
    if (sg) return { k: "wait", t: "⏳ " + T("بانتظار إتمام الاشتراك", "Awaiting subscription completion") };

  }

    });

    /* decline: an in-page box with an optional reason (it reaches the buyer with the decline) — no browser prompt */
    var dc = e.target.closest("[data-decl]");
    if (dc) {
      var f0 = dc.closest("form"), box = f0.querySelector(".dcl");
      if (box) { box.querySelector("textarea").focus(); return; }
      f0.insertAdjacentHTML("beforeend", '<div class="dcl dcard" style="background:var(--sunken)"><label class="f full">' + T("سبب الاعتذار (اختياري)", "Reason for declining (optional)") + '<textarea name="why" maxlength="500" dir="auto" style="min-height:60px"></textarea><small>' + T("بيوصل للمشتري تلقائي مع اعتذارك.", "It reaches the buyer automatically with your decline.") + '</small></label><div class="tools"><button class="btn btn-line" type="button" data-decl-go="' + esc(dc.getAttribute("data-decl")) + '" style="color:#B42318;border-color:#F3C9C9">✋ ' + T("تأكيد الاعتذار", "Confirm the decline") + '</button><button class="btn btn-line" type="button" data-decl-x>' + T("رجوع", "Back") + "</button></div></div>");
      f0.querySelector(".dcl textarea").focus(); return;
    }
    if (e.target.closest("[data-decl-x]")) { var bx = e.target.closest(".dcl"); if (bx) bx.remove(); return; }
    var dg = e.target.closest("[data-decl-go]");
    if (dg) {
      var f = dg.closest("form"), why = (f.querySelector(".dcl textarea") || { value: "" }).value.trim(); dg.disabled = true;
      A.decline(dg.getAttribute("data-decl-go"), why).then(function (j) { if (!j || j.ok !== true) throw { code: "bad_response", error: T("الخادم ماأكدش.", "The server did not confirm.") }; S.inc = null; render(); U.toast(j.buyer_notified ? T("اتسجّل اعتذارك ووصل للمشتري تلقائي.", "Your decline was recorded and the buyer was told automatically.") : T("اتسجّل اعتذارك.", "Your decline was recorded.")); }, function (x) { dg.disabled = false; var er = f.querySelector(".er"); er.hidden = false; er.textContent = U.errText(x); });
    }
  });
  $("#panel").addEventListener("change", function (e) { if (e.target.name === "title" && e.target.closest("#pfF")) { $("#pfTO").hidden = e.target.value !== "_o"; } });
  $("#panel").addEventListener("submit", function (e) {
    e.preventDefault(); var f = e.target, er = f.querySelector(".er"), btn = f.querySelector("button[type=submit]");
    function fail(x) { btn.disabled = false; if (er) { er.hidden = false; er.className = "er erbox"; er.textContent = U.errText(x); if (x && x.code === "full_login_required") er.insertAdjacentHTML("beforeend", ' <button class="btn btn-gold btn-sm" type="button" data-fulllogin>🔑 ' + T("ادخل بكود على بريدك", "Sign in with an e-mail code") + "</button>"); } }
    if (f.id === "pfF") {
      var t = f.elements.title.value === "_o" ? f.elements.title_o.value.trim() : f.elements.title.value, o = { title: t, name: f.elements.name.value.trim(), company: f.elements.company.value.trim(), phone: f.elements.phone.value.trim(), sector: f.elements.sector.value.trim(), governorate: f.elements.governorate.value };
      if (!o.name) { er.className = "er erbox"; er.textContent = T("اكتب اسمك.", "Enter your name."); f.elements.name.focus(); return; }
      if (o.phone && !/^\+?[0-9 ()-]{8,20}$/.test(o.phone.replace(/[٠-٩]/g, function (c) { return "٠١٢٣٤٥٦٧٨٩".indexOf(c); }))) { er.className = "er erbox"; er.textContent = T("رقم الموبايل مش صحيح.", "The mobile number is not valid."); f.elements.phone.focus(); return; }
      btn.disabled = true;
      full(function () { return A.updateMe(o); }).then(function (j) { if (!j || !j.user) throw { code: "bad_response", error: T("الخادم ماأكدش الحفظ.", "The server did not confirm.") }; S.me = j.user; btn.disabled = false; er.className = "er okbox"; er.textContent = T("✓ اتحفظت بياناتك.", "✓ Your details were saved."); nav(); }, fail);
    } else if (f.id === "prF") {
      var E = f.elements, o2 = { email_digest: E.email_digest.checked };
      if (E.wa_optin) o2.wa_optin = E.wa_optin.checked;
      if (E.pause) o2.pause = E.pause.checked;
      if (E.morning_time) o2.morning_time = E.morning_time.value || "09:00";
      if (E.call_today_at) o2.call_today_at = E.call_today_at.value || "";
      if (E.session_time) o2.session_time = E.session_time.value || "";
      var wasPaused = !!S.me.inbox_paused || (S.me.prefs || {}).incoming === false;
      if (E.incoming && E.incoming.checked === wasPaused) o2.incoming = E.incoming.checked; /* sent only when it changes */
      var dayBoxes = f.querySelectorAll('input[name="day"]');
      if (dayBoxes.length) {
        o2.days = [].slice.call(f.querySelectorAll('input[name="day"]:checked')).map(function (x) { return +x.value; });
        if (!o2.days.length && !o2.pause) { er.className = "er erbox"; er.textContent = T("اختار يوم واحد على الأقل، أو علّم «إيقاف مؤقت».", "Choose at least one day, or tick “Pause”."); return; }
      }
      btn.disabled = true;
      full(function () { return A.prefs(o2); }).then(function (j) {
        if (!j || !j.prefs) throw { code: "bad_response", error: T("الخادم ماأكدش الحفظ.", "The server did not confirm.") };
        /* say "saved" only for what the server really stored */
        var sd = dayNums(j.prefs.days), want = o2.days ? o2.days.slice().sort().join(",") : null;
        if (want !== null && sd.slice().sort().join(",") !== want) throw { code: "bad_response", error: T("السيرفر ماحفظش الأيام اللي اخترتها.", "The server did not store the days you chose.") };
        if (o2.incoming != null && j.prefs.incoming !== o2.incoming) throw { code: "bad_response", error: T("السيرفر ماحفظش اختيار استقبال الطلبات.", "The server did not store the routed-requests choice.") };
        S.me.prefs = j.prefs; if (o2.incoming != null) S.me.inbox_paused = !o2.incoming;
        btn.disabled = false; render(); var er2 = document.querySelector("#prF .er"); if (er2) { er2.className = "er okbox"; er2.textContent = T("✓ اتحفظت اختياراتك.", "✓ Your choices were saved."); }
      }, fail);
    } else if (f.classList.contains("rf")) {
      var rref = f.getAttribute("data-rref"), msg = f.elements.message.value.trim();
      if (!msg) { er.hidden = false; er.textContent = T("اكتب رسالتك.", "Write your message."); f.elements.message.focus(); return; }
      btn.disabled = true;
      A.request("/me/incoming/" + encodeURIComponent(rref) + "/reply", { method: "POST", body: { message: msg } }).then(function (j) {
        if (!j || j.ok !== true) throw { code: "bad_response", error: T("الخادم ماأكدش الإرسال.", "The server did not confirm.") };
        S.inc = null; S.focus = String(rref).toUpperCase(); render();
        U.toast(j.buyer_notified ? T("رسالتك وصلت للمشتري تلقائي.", "Your message reached the buyer automatically.") : T("رسالتك اتسجّلت وظاهرة للمشتري في صفحة التتبع، بس إيميل التنبيه ماوصلوش دلوقتي.", "Your message is recorded and shown on the buyer's tracking page, but the e-mail alert did not reach them right now."));
      }, fail);
    } else if (f.classList.contains("qf")) {
      var ref = f.getAttribute("data-qref"), q = { price: f.elements.price.value.trim(), currency: f.elements.currency.value, moq: f.elements.moq.value.trim(), lead_time: f.elements.lead_time.value.trim(), validity: f.elements.validity.value, note: f.elements.note.value.trim() };
      if (!/^\d+([.,]\d+)?$/.test(q.price.replace(/[٠-٩]/g, function (c) { return "٠١٢٣٤٥٦٧٨٩".indexOf(c); }).replace(/,/g, ""))) { er.hidden = false; er.textContent = T("اكتب السعر بالأرقام.", "Enter the price as a number."); f.elements.price.focus(); return; }
      btn.disabled = true;
      A.quote(ref, q).then(function (j) {
        if (!j || j.ok !== true) throw { code: "bad_response", error: T("الخادم ماأكدش الإرسال.", "The server did not confirm.") };
        S.inc = null; S.focus = String(ref).toUpperCase(); render();
        /* the quote is on the buyer's tracking page either way; the e-mail is reported only as the server reports it */
        var what = j.revised ? T("عرضك المعدّل", "Your revised quote") : T("عرضك", "Your quote");
        U.toast(j.buyer_notified ? what + T(" اتبعت للمشتري تلقائي على إيميله وفي صفحة تتبّع طلبه.", " was sent to the buyer automatically, by e-mail and on their tracking page.") : what + T(" اتسجّل وظاهر للمشتري في صفحة تتبّع طلبه، بس إيميل التنبيه ماوصلوش دلوقتي.", " is recorded and shown on the buyer's tracking page, but the e-mail alert did not reach them right now."));
      }, fail);
    }
  });

  /* ---------- sign-in / offline states ---------- */
  function solo(on) { var m = $("#top"); if (m) m.classList.toggle("solo", !!on); }
  function signedOut(offline, why) {
    $("#dnav").hidden = true; solo(true);
    /* an e-mailed login link that the server refused (used, expired, not this member's): say so, then the normal code sign-in */
    var le = S.linkErr && S.linkErr.code !== "offline" ? '<div class="erbox" role="alert">🔗 ' + esc(U.errText(S.linkErr)) + '<br><small style="font-weight:600">' + T("تقدر كمان ترد على الطلب أو تبعت عرض سعر من رابط «رد سريع» اللي في نفس الإيميل، من غير تسجيل دخول.", "You can also answer or send a quote from the quick-reply link in the same e-mail, without signing in.") + "</small></div>" : "";
    $("#panel").innerHTML = '<div class="dcard lgcard"><img src="img/logo-site.png" alt="' + esc(T("منصة صنع في مصر", "Made in Egypt Gate")) + '"><h1 style="font-size:1.4rem;font-weight:800">' + T("لوحتي", "My dashboard") + "</h1>" + le
      + (offline ? '<div class="mig-off" role="status">' + esc(why && why.code !== "offline" ? U.errText(why) : U.offline()) + "</div>" : "<p>" + T("ادخل ببريدك الإلكتروني: هيوصلك كود من 6 أرقام. مفيش كلمة سر.", "Sign in with your e-mail: you'll receive a 6-digit code. No password.") + '</p><button class="btn btn-green" type="button" id="lgGo" style="min-width:220px">🔑 ' + T("الدخول بالبريد", "Sign in with e-mail") + "</button>")
      + '<p class="note">' + T("مش مسجّل؟ ", "Not registered? ") + '<a href="register.html">' + T("سجّل شركتك", "Register your company") + "</a> · " + T("تقدر كمان تبعت طلب عرض سعر من غير حساب: ", "You can also send a request without an account: ") + '<a href="contact.html#rfq-form">' + T("ابعت طلب", "Send a request") + "</a></p></div>";
    var b = $("#lgGo"); if (b) b.onclick = function () { A.open().catch(function () {}); };
  }
  function boot() {
    fromHash();
    /* opened from a routed-request e-mail (#lt=…): data/mig-api.js exchanges the one-time link for a session first */
    var L = A.linkLogin ? A.linkLogin() : null;
    if (L && !S.linkDone) {
      S.linkDone = true; $("#dnav").hidden = true; solo(true);
      $("#panel").innerHTML = '<div class="dcard lgcard"><p class="note">⏳ ' + T("بنسجّل دخولك من الرابط اللي وصلك على الإيميل…", "Signing you in from the link in your e-mail…") + "</p></div>";
      L.then(function () { S.viaLink = true; boot(); }, function (e) {
        S.linkErr = e; if (e && e.code === "offline") { signedOut(true); return; }
        if (A.token()) setTimeout(function () { U.toast(U.errText(e)); }, 700); /* still signed in on this browser: the request is in «طلبات واردة لي» */
        boot();
      });
      return;
    }
    if (!A.token()) {
      /* is the platform API connected? (GET /api/auth/health: 200 JSON when it is — no /me call, so no 401 for a signed-out visitor) */
      (A.ping ? A.ping() : Promise.reject({ code: "offline" })).then(function (j) {
        if (j && j.auth === false) { signedOut(true, { code: "auth_off" }); return; }
        signedOut(false); if (!S.linkErr) setTimeout(function () { if (!A.token()) A.open().catch(function () {}); }, 250);
      }, function (e) { signedOut(!e || e.code === "offline" || e.status >= 500, e); });
      return;
    }
    $("#panel").innerHTML = loading();
    A.me().then(function (r) { if (!r || !r.user) { signedOut(false); return; } S.me = r.user; S.unread = r.unread || 0; render(); }, function (e) {
      if (e && e.code === "offline") { var c = A.user(); $("#dnav").hidden = true; solo(true); $("#panel").innerHTML = '<div class="dcard lgcard"><h1 style="font-size:1.3rem;font-weight:800">' + T("لوحتي", "My dashboard") + (c ? " — " + esc(U.shortName(c)) : "") + '</h1><div class="mig-off" role="status">' + esc(U.offline()) + "</div></div>"; return; }
      signedOut(false);
    });
  }
  /* a sign-in on this page (code dialog). The e-mailed link's own sign-in is handled by boot() above. */
  window.addEventListener("mig:login", function (e) { if (e && e.detail && e.detail.via === "link") return; if (S.hold) return; /* a save being retried after the code sign-in (full()) re-renders itself */ S = { tab: S.tab, focus: S.focus, me: null, unread: 0, linkDone: true }; boot(); });
  window.addEventListener("mig:notif", function (e) { var n = e.detail ? +e.detail.unread || 0 : 0; if (S.me && n !== S.unread) { S.unread = n; S.notif = null; nav(); } });
  /* every server answer about the signed-in member (MIGAPI.me / updateMe — e.g. after «باقتي» issued an invoice) keeps S.me current, so the
     Gulf-states card, the overview prompt and the plan follow what the server stored (review B-1); the caller draws the page again */
  window.addEventListener("mig:me", function (e) { var u = e && e.detail && e.detail.user; if (S.me && u && u.id === S.me.id) S.me = u; });
  boot();
})();
</script>
