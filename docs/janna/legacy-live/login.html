<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="img/logo-site.png"><title>دخول المصانع – منصة صنع في مصر</title><meta name="robots" content="noindex">
<style>body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f3f6f4;display:flex;min-height:100vh;align-items:center;justify-content:center}.c{background:#fff;border-radius:16px;box-shadow:0 8px 30px #0001;padding:28px;width:min(92vw,400px)}h1{margin:0 0 4px;color:#8E0B20;font-size:22px}p{color:#666;margin:0 0 16px}label{display:block;font-weight:700;margin:12px 0 4px}input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cdd6d1;border-radius:10px;font-size:15px}button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:10px;background:#8E0B20;color:#fff;font-size:16px;font-weight:700;cursor:pointer}#e{color:#b00020;font-weight:700;margin-top:10px;min-height:20px}a{color:#8E0B20}</style></head><body><div class="c"><img src="img/logo-site.png" alt="صنع في مصر" style="height:56px;display:block;margin:0 auto 10px"><h1>دخول المصانع</h1><p>منصة صنع في مصر</p>
<form id="f"><label>البريد الإلكتروني</label><input id="m" type="email" required dir="ltr" autocomplete="username"><label>كلمة المرور</label><input id="p" type="password" required dir="ltr" autocomplete="current-password"><button>دخول</button><div id="e"></div></form>
<p style="margin-top:14px">ليس لديك حساب؟ <a href="register.html#plans">سجّل شركتك</a> · <a href="home.html">الرئيسية</a></p></div>
<script>document.getElementById("f").onsubmit=function(ev){ev.preventDefault();var e=document.getElementById("e");e.textContent="";fetch("api/index.php?a=login",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:m.value,password:p.value})}).then(function(r){return r.json()}).then(function(r){if(r.ok)location.href="dashboard.html";else e.textContent=r.error||"تعذّر الدخول"}).catch(function(){e.textContent="تعذّر الاتصال"})};</script></body></html>
